<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="styles.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
   <div class="entireContainer">
    <div class="calculator">
        <div class="display-container">
            <div class="display">0</div>
            </div>
        <div class="num-op-container">
            
            <div class="numbers-and-zero">
             <div class="numbers">
               
                 <button class="individual-number" id="one">1</button>
                 <button class="individual-number" id="two">2</button>
                 <button class="individual-number" id="three">3</button>
                 <button class="individual-number" id="four">4</button>
                 <button class="individual-number" id="five">5</button>
                 <button class="individual-number" id="six">6</button>
                 <button class="individual-number" id="seven">7</button>
                 <button class="individual-number" id="eight">8</button>
                 <button class="individual-number" id="nine">9</button>
                

                </div>  
             <div class="zero-coma">
                <button class="zero">0</button>
                <button class="coma">.</button>

             </div>
            </div>
                
            <div class="operators">
             <button class="individual-operator" id="clear">AC</button>
             <button class="individual-operator" id="addition">+</button>
             <button class="individual-operator" id="subtract">-</button>
             <button class="individual-operator" id="multiply">x</button>
             <button class="individual-operator" id="divide">÷</button>
             <button class="individual-operator" id="equal">=</button>
            </div>

        </div>

    </div>

</div>   

<script src="script.js"></script>
</body>

</html>
